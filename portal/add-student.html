<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student | ValerisEdu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/portal.css">
<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="images/logo-icohttps://valerisedu.com/portal/add-student.htmln.png">
            <span>ValerisEdu</span>
        </div>

        <nav class="sidebar-nav">

            <a href="admin-dashboard.html">Dashboard</a>
            <a href="all-students.html">All Students</a>
            <a class="active" href="add-student.html">Add Student</a>
            <a href="#">Applications</a>
            <a href="document-review.html">Documents</a>
            <a href="communication.html">Communication</a>
            <a href="settings.html">Settings</a>

        </nav>

    </aside>

    <main class="dashboard-main">

        <div class="students-header">

            <div>
                <h1>Add Student</h1>
                <p>Create a new ValerisEdu student account</p>
            </div>

        </div>

        <div class="wizard-card">

            <form id="studentForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>First Name</label>
                        <input id="firstName" type="text" required>
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input id="lastName" type="text" required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input id="dob" type="date">
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input id="mobile" type="text">
                    </div>

                    <div class="form-group">
                        <label>Portal Email</label>
                        <input id="portalEmail" type="email" required>
                    </div>

                    <div class="form-group">
                        <label>Portal Password</label>
                        <input id="portalPassword" type="text" required>
                    </div>

                    <div class="form-group">
                        <label>Partner</label>

                        <select id="partner">

                            <option>Direct Application</option>
                            <option>Leverage</option>
                            <option>ApplyBoard</option>
                            <option>Adventus</option>
                            <option>FSW Flow</option>

                        </select>

                    </div>

                    <div class="form-group">
                        <label>Country</label>

                        <select id="country">

                            <option>United Kingdom</option>
                            <option>Germany</option>
                            <option>Ireland</option>
                            <option>Canada</option>
                            <option>Singapore</option>
                            <option>Georgia</option>
                            <option>Spain</option>

                        </select>

                    </div>

                    <div class="form-group">
                        <label>Intake</label>

                        <select id="intake">

                            <option>Summer 2026</option>
                            <option>Winter 2026</option>
                            <option>Summer 2027</option>
                            <option>Winter 2027</option>

                        </select>

                    </div>

                </div>

                <div class="wizard-actions">

                    <button
                        type="submit"
                        class="new-student-btn">
                        Create Student
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

<script type="module" src="js/add-student.js"></script>

</body>
</html>
